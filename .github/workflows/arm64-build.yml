name: Build ARM64 Release

on:
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: "Upstream baldurk/renderdoc tag (e.g. v1.46). Leave empty or use 'latest' for the latest stable release."
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  QT_STATIC_PREFIX: ${{ github.workspace }}/.qt-static/5.15.17
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  prepare:
    name: Prepare static Qt
    runs-on: ubuntu-26.04-arm
    outputs:
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      release_tag: ${{ steps.version.outputs.release_tag }}

    steps:
      - name: Checkout ARM64 automation
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Resolve upstream version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.upstream_tag }}
        run: |
          set -euo pipefail

          requested="${REQUESTED_TAG}"
          if [[ -z "$requested" || "$requested" == "latest" ]]; then
            tag="$(gh api repos/baldurk/renderdoc/releases/latest --jq '.tag_name')"
          else
            tag="$requested"

            if ! gh api "repos/baldurk/renderdoc/git/ref/tags/$tag" >/dev/null 2>&1; then
              if [[ "$tag" != v* ]] && gh api "repos/baldurk/renderdoc/git/ref/tags/v$tag" >/dev/null 2>&1; then
                tag="v$tag"
              else
                echo "Upstream tag '$requested' does not exist." >&2
                exit 1
              fi
            fi
          fi

          if [[ ! "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "Unsupported upstream tag format: $tag" >&2
            exit 1
          fi

          release_tag="${tag}_arm64"

          echo "upstream_tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

          echo "Upstream tag: $tag"
          echo "ARM64 release tag: $release_tag"

      - name: Install static Qt build dependencies
        run: bash automation/packaging/arm64/install_build_deps.sh

      - name: Build static Qt from scratch
        run: |
          set -euo pipefail
          rm -rf "$QT_STATIC_PREFIX"
          bash automation/packaging/arm64/build_static_qt.sh "$QT_STATIC_PREFIX"

      - name: Verify static Qt
        run: |
          set -euo pipefail
          "$QT_STATIC_PREFIX/bin/qmake" -v
          test -f "$QT_STATIC_PREFIX/lib/libQt5Core.a"
          test -f "$QT_STATIC_PREFIX/lib/libQt5Gui.a"
          test -f "$QT_STATIC_PREFIX/lib/libQt5Widgets.a"
          test -f "$QT_STATIC_PREFIX/lib/libQt5Network.a"
          test -f "$QT_STATIC_PREFIX/lib/libQt5Svg.a"
          test -f "$QT_STATIC_PREFIX/lib/libQt5X11Extras.a"

      - name: Package static Qt for this workflow run
        run: |
          set -euo pipefail
          tar -C "$QT_STATIC_PREFIX" -czf static-qt-5.15.17-arm64.tar.gz .

      - name: Upload static Qt workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: static-qt-5.15.17-arm64
          path: static-qt-5.15.17-arm64.tar.gz
          if-no-files-found: error
          retention-days: 1

  debug-test:
    name: Static Debug unit tests
    needs: prepare
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Checkout ARM64 automation
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Checkout upstream RenderDoc
        uses: actions/checkout@v6
        with:
          repository: baldurk/renderdoc
          ref: ${{ needs.prepare.outputs.upstream_tag }}
          path: source
          fetch-depth: 1

      - name: Patch personal ARM64 branding
        run: python3 automation/packaging/arm64/patch_source.py source

      - name: Install Debug build dependencies
        run: bash automation/packaging/arm64/install_build_deps.sh

      - name: Download static Qt from prepare job
        uses: actions/download-artifact@v8
        with:
          name: static-qt-5.15.17-arm64
          path: qt-artifact

      - name: Restore static Qt for this job
        run: |
          set -euo pipefail
          rm -rf "$QT_STATIC_PREFIX"
          mkdir -p "$QT_STATIC_PREFIX"
          tar -C "$QT_STATIC_PREFIX" -xzf qt-artifact/static-qt-5.15.17-arm64.tar.gz
          "$QT_STATIC_PREFIX/bin/qmake" -v

      - name: Configure static Debug build
        run: |
          CC=gcc-14 CXX=g++-14 cmake -S source -B build-debug \
            -DCMAKE_BUILD_TYPE=Debug \
            -DSTATIC_QRENDERDOC=ON \
            -DQRENDERDOC_NO_CXX11_REGEX=ON \
            -DQRENDERDOC_ENABLE_PYSIDE2=OFF \
            -DQT_QMAKE_EXECUTABLE="$QT_STATIC_PREFIX/bin/qmake" \
            -DQMAKE_EXECUTABLE="$QT_STATIC_PREFIX/bin/qmake" \
            -DPython3_USE_STATIC_LIBS=TRUE \
            -DFORCE_PY_VERSION=3.14

      - name: Build static Debug
        run: cmake --build build-debug --parallel "$(nproc)"

      - name: Prepare Python standard library for Debug tests
        run: |
          set -euo pipefail

          pyver="$(python3.14 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          stdlib="$(python3.14 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          destshared="$(python3.14 -c 'import sysconfig; print(sysconfig.get_config_var("DESTSHARED") or "")')"
          pylib_root="build-debug/share/renderdoc/pylibs/lib/python${pyver}"

          mkdir -p "$pylib_root"
          cp -a "$stdlib/." "$pylib_root/"

          if [[ -n "$destshared" && -d "$destshared" && "$destshared" != "$stdlib/lib-dynload" ]]; then
            mkdir -p "$pylib_root/lib-dynload"
            cp -a "$destshared/." "$pylib_root/lib-dynload/"
          fi

          find "$pylib_root" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          rm -rf \
            "$pylib_root/test" \
            "$pylib_root/idlelib" \
            "$pylib_root/ensurepip" \
            "$pylib_root/site-packages"

      - name: Verify Debug runtime links
        run: |
          set -euo pipefail

          ldd build-debug/bin/qrenderdoc | tee qrenderdoc-debug-ldd.txt

          if grep -E 'libQt5|libQt6' qrenderdoc-debug-ldd.txt; then
            echo "ERROR: Debug qrenderdoc still dynamically links Qt." >&2
            exit 1
          fi

          if grep -E 'libpython[0-9]' qrenderdoc-debug-ldd.txt; then
            echo "ERROR: Debug qrenderdoc still dynamically links Python." >&2
            exit 1
          fi

      - name: Run core unit tests
        run: |
          set -euo pipefail
          build-debug/bin/renderdoccmd test unit -o core-unit-tests.log
          cat core-unit-tests.log

      - name: Run QRenderDoc unit tests
        run: |
          set -euo pipefail
          build-debug/bin/qrenderdoc --unittest log=qrenderdoc-unit-tests.log
          cat qrenderdoc-unit-tests.log

      - name: Upload Debug validation logs
        uses: actions/upload-artifact@v7
        with:
          name: debug-validation-${{ needs.prepare.outputs.release_tag }}
          path: |
            qrenderdoc-debug-ldd.txt
            core-unit-tests.log
            qrenderdoc-unit-tests.log
          if-no-files-found: error

  release-build:
    name: Static Release build
    needs: prepare
    runs-on: ubuntu-26.04-arm
    outputs:
      upstream_sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Checkout ARM64 automation
        uses: actions/checkout@v6
        with:
          path: automation

      - name: Checkout upstream RenderDoc
        uses: actions/checkout@v6
        with:
          repository: baldurk/renderdoc
          ref: ${{ needs.prepare.outputs.upstream_tag }}
          path: source
          fetch-depth: 1

      - name: Patch personal ARM64 branding
        run: python3 automation/packaging/arm64/patch_source.py source

      - name: Record upstream source revision
        id: source
        run: |
          set -euo pipefail
          sha="$(git -C source rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Building upstream ${{ needs.prepare.outputs.upstream_tag }} at $sha"

      - name: Install Release build dependencies
        run: bash automation/packaging/arm64/install_build_deps.sh

      - name: Download static Qt from prepare job
        uses: actions/download-artifact@v8
        with:
          name: static-qt-5.15.17-arm64
          path: qt-artifact

      - name: Restore static Qt for this job
        run: |
          set -euo pipefail
          rm -rf "$QT_STATIC_PREFIX"
          mkdir -p "$QT_STATIC_PREFIX"
          tar -C "$QT_STATIC_PREFIX" -xzf qt-artifact/static-qt-5.15.17-arm64.tar.gz
          "$QT_STATIC_PREFIX/bin/qmake" -v

      - name: Configure static Release build
        run: |
          CC=gcc-14 CXX=g++-14 cmake -S source -B build-release \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/dist" \
            -DVULKAN_LAYER_FOLDER="${{ github.workspace }}/dist/share/vulkan/implicit_layer.d" \
            -DSTATIC_QRENDERDOC=ON \
            -DQRENDERDOC_NO_CXX11_REGEX=ON \
            -DQRENDERDOC_ENABLE_PYSIDE2=OFF \
            -DQT_QMAKE_EXECUTABLE="$QT_STATIC_PREFIX/bin/qmake" \
            -DQMAKE_EXECUTABLE="$QT_STATIC_PREFIX/bin/qmake" \
            -DPython3_USE_STATIC_LIBS=TRUE \
            -DFORCE_PY_VERSION=3.14

      - name: Build static Release
        run: cmake --build build-release --parallel "$(nproc)"

      - name: Install static Release
        run: cmake --install build-release

      - name: Bundle Python standard library
        run: |
          set -euo pipefail

          pyver="$(python3.14 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          stdlib="$(python3.14 -c 'import sysconfig; print(sysconfig.get_path("stdlib"))')"
          destshared="$(python3.14 -c 'import sysconfig; print(sysconfig.get_config_var("DESTSHARED") or "")')"
          pylib_root="dist/share/renderdoc/pylibs/lib/python${pyver}"

          mkdir -p "$pylib_root"
          cp -a "$stdlib/." "$pylib_root/"

          if [[ -n "$destshared" && -d "$destshared" && "$destshared" != "$stdlib/lib-dynload" ]]; then
            mkdir -p "$pylib_root/lib-dynload"
            cp -a "$destshared/." "$pylib_root/lib-dynload/"
          fi

          find "$pylib_root" -type d -name __pycache__ -prune -exec rm -rf '{}' +
          rm -rf \
            "$pylib_root/test" \
            "$pylib_root/idlelib" \
            "$pylib_root/ensurepip" \
            "$pylib_root/site-packages"

      - name: Add application icon to package
        run: |
          mkdir -p dist/share/renderdoc
          cp source/qrenderdoc/Resources/logo.svg dist/share/renderdoc/renderdoc-logo.svg

      - name: Verify Release binaries and runtime links
        run: |
          set -euo pipefail

          file build-release/bin/qrenderdoc
          file build-release/bin/renderdoccmd
          file build-release/lib/librenderdoc.so
          build-release/bin/renderdoccmd --version

          ldd build-release/bin/qrenderdoc | tee qrenderdoc-release-ldd.txt
          ldd build-release/bin/renderdoccmd | tee renderdoccmd-release-ldd.txt
          ldd build-release/lib/librenderdoc.so | tee librenderdoc-release-ldd.txt

          if grep -E 'libQt5|libQt6' qrenderdoc-release-ldd.txt; then
            echo "ERROR: Release qrenderdoc still dynamically links Qt." >&2
            exit 1
          fi

          if grep -E 'libpython[0-9]' qrenderdoc-release-ldd.txt; then
            echo "ERROR: Release qrenderdoc still dynamically links Python." >&2
            exit 1
          fi

      - name: Archive tested Release candidate
        run: tar -C dist -czf renderdoc-linux-arm64.tar.gz .

      - name: Prepare standalone installer scripts
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          cp automation/packaging/arm64/install.sh install.sh
          cp automation/packaging/arm64/uninstall.sh uninstall.sh
          sed -i "s/__RELEASE_TAG__/$RELEASE_TAG/g" install.sh
          chmod +x install.sh uninstall.sh

          if grep -q '__RELEASE_TAG__' install.sh; then
            echo "Installer release tag substitution failed." >&2
            exit 1
          fi

      - name: Upload Release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ needs.prepare.outputs.release_tag }}
          path: |
            renderdoc-linux-arm64.tar.gz
            install.sh
            uninstall.sh
            qrenderdoc-release-ldd.txt
            renderdoccmd-release-ldd.txt
            librenderdoc-release-ldd.txt
          if-no-files-found: error

  publish:
    name: Publish ARM64 Release
    needs:
      - prepare
      - debug-test
      - release-build
    runs-on: ubuntu-26.04-arm

    steps:
      - name: Download successful Release candidate
        uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ needs.prepare.outputs.release_tag }}
          path: release-candidate

      - name: Verify publish inputs
        run: |
          set -euo pipefail
          test -f release-candidate/renderdoc-linux-arm64.tar.gz
          test -f release-candidate/install.sh
          test -f release-candidate/uninstall.sh

      - name: Create or update versioned release
        env:
          UPSTREAM_TAG: ${{ needs.prepare.outputs.upstream_tag }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          UPSTREAM_SHA: ${{ needs.release-build.outputs.upstream_sha }}
        working-directory: release-candidate
        run: |
          set -euo pipefail

          export TIMESTAMP="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          export RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          export UPSTREAM_URL="https://github.com/baldurk/renderdoc/releases/tag/${UPSTREAM_TAG}"
          title="RenderDoc ${UPSTREAM_TAG} Personal ARM64 Build"

          release_exists=false
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            release_exists=true
            gh release view "$RELEASE_TAG" --json body --jq '.body // ""' > previous-release-notes.md
          else
            : > previous-release-notes.md
          fi

          python3 - <<'PY'
          import os
          from pathlib import Path

          upstream_tag = os.environ["UPSTREAM_TAG"]
          upstream_sha = os.environ["UPSTREAM_SHA"]
          upstream_url = os.environ["UPSTREAM_URL"]
          timestamp = os.environ["TIMESTAMP"]
          run_url = os.environ["RUN_URL"]
          run_id = os.environ["GITHUB_RUN_ID"]
          bt = chr(96)

          previous = Path("previous-release-notes.md").read_text(encoding="utf-8")
          previous = previous.replace("\\n", "\n")
          previous = previous.replace("\\" + bt, bt)

          marker = "## Rebuild history"
          history = []
          if marker in previous:
              history_text = previous.split(marker, 1)[1]
              history = [
                  line.strip()
                  for line in history_text.splitlines()
                  if line.strip().startswith("- ")
              ]

          entry = (
              f"- {timestamp}: rebuilt from upstream {bt}{upstream_tag}{bt} "
              f"({bt}{upstream_sha}{bt}) in [workflow run {run_id}]({run_url})."
          )
          if entry not in history:
              history.append(entry)

          lines = [
              f"Personal ARM64 Linux build of upstream RenderDoc **{upstream_tag}**.",
              "",
              f"- Upstream release: {upstream_url}",
              f"- Upstream commit: {bt}{upstream_sha}{bt}",
              "- Architecture: ARM64 / AArch64",
              "- Build OS: Ubuntu 26.04 ARM64",
              "- Qt: statically linked (Qt 5.15.17)",
              "- Python runtime: statically linked; standard library bundled",
              "- Validation: static Debug core/QRenderDoc unit tests and static Release runtime-link validation both passed",
              f"- Installation: download and run {bt}install.sh{bt}; user files are installed under {bt}~/.local{bt} and missing system runtime packages are installed with apt.",
              "",
              marker,
              *history,
              "",
          ]

          Path("release-notes.md").write_text("\n".join(lines), encoding="utf-8")
          PY

          if [[ "$release_exists" == true ]]; then
            echo "Updating existing release $RELEASE_TAG"

            gh release upload "$RELEASE_TAG" \
              renderdoc-linux-arm64.tar.gz \
              install.sh \
              uninstall.sh \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --title "$title" \
              --notes-file release-notes.md
          else
            echo "Creating new release $RELEASE_TAG"

            gh release create "$RELEASE_TAG" \
              renderdoc-linux-arm64.tar.gz \
              install.sh \
              uninstall.sh \
              --target "${GITHUB_SHA}" \
              --title "$title" \
              --notes-file release-notes.md
          fi

          {
            echo "## ARM64 release"
            echo
            echo "- Upstream: $UPSTREAM_TAG"
            echo "- Release: $RELEASE_TAG"
            echo "- Upstream commit: $UPSTREAM_SHA"
            echo "- Debug validation: passed"
            echo "- Release validation: passed"
            echo "- Release URL: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          } >> "$GITHUB_STEP_SUMMARY"
